[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-observability"
version = "0.1.0"
description = "Pipeline timing, resource capture, and offline evidence assessment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
warden-record-events = "warden_observability.cli.record_events:main"
warden-record-resources = "warden_observability.cli.record_resources:main"
warden-assemble = "warden_observability.cli.assemble:main"
warden-assess = "warden_observability.cli.assess:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
